[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiggygit"
version = "0.1.0"
description = "AI 辅助 Git 操作的命令行工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zheyuan Chen", email = "chenzheyuan@gmail.com" }]
keywords = ["git", "cli", "ai", "claude"]
dependencies = ["anthropic>=0.69"]

[project.urls]
Homepage = "https://github.com/rich-richer/AIggyGit"

[project.scripts]
aig = "aiggygit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
